# Every test harness runs on every push to a branch and every pull request.
# A pushed tag runs release.yml instead, which runs the same tests once.
# The runner image is pinned: the smoke job installs system packages, and
# ubuntu-latest moves to the next Ubuntu on GitHub's schedule.
name: ci

on:
  push:
    branches: ['**']
  # Labelling runs the checks again: the changelog job reads the labels from
  # the event that started the run, so a re-run after labelling sees none.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# One run per branch at a time: a push cancels the run of the push before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  corpus-lint:
    name: corpus lint and spec coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node test/run.js --lint

  conformance:
    name: conformance corpus and sample notes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node test/run.js
      - run: node test/samples.js

  perf:
    name: performance budgets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node test/perf.js

  fuzz:
    name: fuzz (30 s)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node test/fuzz.js --seconds=30 --seed=${{ github.run_id }} # a new seed per run: every run tries new inputs
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: fuzz-failures
          path: test/fuzz-failures/

  smoke:
    name: browser smoke (Chromium, Firefox)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev # the engine has no runtime dependency; the lockfile keeps that checkable
      # The CDN copies the smoke tests serve (KaTeX, highlight.js, Mermaid,
      # Temml), keyed on the add-ons' version tables, and Playwright's
      # browsers; restored after npm ci, which empties node_modules.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/luccet-smoke
          key: luccet-smoke-${{ hashFiles('test/smoke.js') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium firefox
      - run: sudo apt-get install -y mupdf-tools # mutool, for the PDF text test
      - run: node test/smoke.js

  build:
    name: luccet.js is the build of src/
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/concat.js --check
      - run: node tools/version.js --check # every place that names the version agrees with package.json
      - run: node test/palette.js # luccet.css's own palettes are readable (the themes are checked in Luccet/themes)
      - run: node test/package.js # what npm pack ships, the exports map, the declarations
      # The package, installed from its tarball into an empty folder: the
      # engine requires, the command runs, a subpath export resolves.
      - name: the package installs and runs
        run: |
          npm pack --ignore-scripts
          mkdir -p /tmp/pkg && cd /tmp/pkg && npm init -y >/dev/null && npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/luccet-*.tgz
          node -e "const t = require('luccet'); if (t.version !== require('luccet/package.json').version) throw new Error('version'); console.log('require ok', t.version, t.toHTML('# Hi').trim())"
          node -e "require('luccet/cli/language.js'); require('luccet/test/fixtures/detect.json'); console.log('subpaths ok')"
          npx luccet --version

  # What release.yml and site.yml deploy, built but not deployed: the pages
  # and every release in its own folder, each luccet.js minified and checked.
  site:
    name: the site builds, with every release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/site.js

  cli:
    name: API, command line, language server and documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node test/api.js
      - run: node test/cli.js
      - run: node test/lsp.js
      - run: node test/docs.js # the documentation's pages, live examples and links
      - run: node test/skills.js # skills/: the agent skills, their format, examples and links

  # The command line and the language server on Windows: paths, the sandbox
  # child, the pipes.
  windows:
    name: command line and language server on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node test/cli.js
      - run: node test/lsp.js

  # WebKit, the engine behind Safari, in the smoke matrix, blocking as
  # Chromium and Firefox do.
  webkit:
    name: browser smoke (WebKit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/luccet-smoke
          key: luccet-smoke-${{ hashFiles('test/smoke.js') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps webkit
      - run: sudo apt-get install -y mupdf-tools
      - run: node test/smoke.js --browsers=webkit

  # Coverage of the Node suites (not perf or fuzz, whose budgets and timing
  # instrumentation would skew), with c8 over the engine, the command line
  # and the add-ons; the lcov report is an artifact of the run.
  coverage:
    name: coverage report (c8)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: |
          for t in run tex api samples palette package cli language lsp docs skills; do
            npx --yes c8@12.0.0 --clean=false --reporter=none node test/$t.js || exit 1
          done
          npx --yes c8@12.0.0 report --reporter=text-summary --reporter=lcov --include='luccet.js' --include='cli/**' --include='tools/**'
      - uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/

  # A pull request changes CHANGELOG.md: a line for a reader of the previous
  # release (CONTRIBUTING.md). A change that needs none is labelled no-changelog.
  changelog:
    name: the changelog has a line for this change
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          if git diff --name-only "origin/${{ github.base_ref }}" HEAD | grep -qx CHANGELOG.md; then
            echo "CHANGELOG.md changed"
          else
            echo "::error::CHANGELOG.md has no line for this change; add one under the unreleased section, or label the pull request no-changelog"
            exit 1
          fi

  # The release job is .github/workflows/release.yml (a pushed tag vX.Y.Z).
