# The release job. Pushing a tag vX.Y.Z runs every test, checks that the tag
# matches luccet.version and that luccet.js is the build of src/, publishes
# the site to GitHub Pages (tools/site.js: the pages, and each release from
# 2.0 on in a folder of its own, vX.Y.Z/, which cdn.luccet.dev serves), and
# drafts the GitHub Release with a minified luccet.js (under the same name),
# luccet.css and a zip of the distribution attached; the maintainer
# publishes the draft. The npm package is installed from the tag
# (npm install github:Luccet/luccet#vX.Y.Z), not from the registry. Between
# releases, site.yml publishes the pages of main with this tag's engine.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # the draft release and its asset (the asset job); the others read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: the tag matches luccet.version and package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          engine="$(node -p "require('./luccet.js').version")"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag $tag, luccet.version $engine, package.json $pkg"
          test "$tag" = "$engine" && test "$tag" = "$pkg"
      - run: node tools/version.js --check # and so do the README and the docs
      - run: npm test
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/luccet-smoke
          key: luccet-smoke-${{ hashFiles('test/smoke.js') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium firefox
      - run: sudo apt-get install -y mupdf-tools
      - run: node test/smoke.js

  # A minified luccet.js, built from the committed one with a pinned terser,
  # checked to be the same version and to render, and attached to a draft
  # release as `luccet.js`: the same name, so the tools and the editors take a
  # note that loads it. The release's notes are the changelog's section.
  asset:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The same bytes as the site's vX.Y.Z/luccet.js: tools/site.js minifies
      # both, with its pinned terser, and checks the compile hint, the version
      # and that the build renders.
      - name: min/luccet.js
        run: |
          node tools/site.js --minify luccet.js min/luccet.js
          test "$(node -p "require('./min/luccet.js').version")" = "${GITHUB_REF_NAME#v}"
          ls -l luccet.js min/luccet.js
      - name: the release notes, from CHANGELOG.md
        run: |
          node tools/version.js --notes > notes.md
          printf '\n\n`luccet.js` below is the minified build of this release: the same version, under the same name, for a site where bytes matter.\n' >> notes.md
          cat notes.md
      - name: the distribution zip
        run: |
          mkdir -p dist/luccet
          cp -r luccet.js luccet.css luccet.d.ts LICENSE CHANGELOG.md dist/luccet/
          (cd dist && zip -qr "luccet-$GITHUB_REF_NAME.zip" luccet)
          ls -l dist/*.zip
      - name: the draft release, with min/luccet.js as luccet.js, luccet.css and the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" min/luccet.js luccet.css "dist/luccet-$GITHUB_REF_NAME.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file notes.md min/luccet.js luccet.css "dist/luccet-$GITHUB_REF_NAME.zip"
          fi

  pages:
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags: the site serves every release, each from its own
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # A site deployed from an artifact is served as it is (no Jekyll), so
      # .nojekyll is not copied; upload-pages-artifact leaves dotfiles out anyway.
      # Its luccet.js is the release's, minified as the asset job's (site.yml says why).
      - name: the site
        run: |
          node tools/site.js
          test "$(node -p "require('./_site/luccet.js').version")" = "${GITHUB_REF_NAME#v}"
          test -f "_site/$GITHUB_REF_NAME/luccet.js"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
