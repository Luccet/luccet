# The site between releases. Run by hand from the Actions tab (on main): it
# publishes the pages of main (index.html, docs/, examples/) with the engine
# of the newest release (luccet.js and luccet.css from the newest
# v* tag), so a documentation fix reaches luccet.dev without a tag, and
# what the site serves to notes that load its luccet.js stays a release;
# every release, each in a folder of its own (tools/site.js), as well. The
# docs and samples suites run against that engine first: a page that needs
# what the release does not have is refused here, not published.
# release.yml publishes the whole tree of a tag; the two share the pages
# concurrency group, so a deploy waits for the one before it.
name: site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: on main only
        run: |
          test "$GITHUB_REF_NAME" = main || { echo "run this workflow on main, not $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: the engine of the newest release
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          test -n "$tag" || { echo "no v* tag: nothing released yet"; exit 1; }
          git checkout "$tag" -- luccet.js luccet.css
          engine="$(node -p "require('./luccet.js').version")"
          echo "pages from main at ${GITHUB_SHA::7}, engine $engine from $tag"
          test "v$engine" = "$tag"
          echo "Pages from \`main\` at ${GITHUB_SHA::7}, engine $engine from \`$tag\`." >> "$GITHUB_STEP_SUMMARY"
      - name: the pages render with that engine
        run: |
          node test/docs.js
          node test/samples.js
      # The site's luccet.js is the release's, minified as the GitHub Release's
      # asset is (the same version, the same name), for the bytes it saves
      # every first visit: 61 KB gzipped where the build is 110 KB.
      - name: the site
        run: node tools/site.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
