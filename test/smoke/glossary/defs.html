# Definitions {#defs}

A :dfn[truism] is a claim so obviously true that it goes without saying; see [the glossary](glossary.html) and @ker.

:::definition[Kernel]{#ker}
The set of vectors $v$ with $T(v) = 0$, written $\ker T$.
:::

- The :dfn[nullity] of $T$ is the dimension of its kernel, see @ker.
