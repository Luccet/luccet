<!doctype html><meta charset="utf-8"><script src="/luccet.js"></script>

<script>
  window.__log = [];
  const mathml = () => document.querySelectorAll('main.luccet .t-math > math').length;
  luccet.define('probe', (el) => window.__log.push(`define ${el.id} math=${mathml()}`));
  luccet.on('render', () => window.__log.push(`render math=${mathml()}`));
  luccet.on('math', (root) => window.__log.push(`math ${root.localName} math=${mathml()}`));
  luccet.on('ready', () => window.__log.push('ready'));
  luccet.ready.then(() => window.__log.push('ready-promise'));
</script>

# Smoke: lifecycle

The formulas are MathML from the mount on, so the behaviours already see
them; 'render', 'math' and 'ready' still follow, in that order.
