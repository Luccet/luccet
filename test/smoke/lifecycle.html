<!doctype html><meta charset="utf-8"><script src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js"></script><script src="/luccet.js" data-use="/addons/katex.js"></script>

<script>
  window.__log = [];
  const typeset = () => document.querySelectorAll('main.luccet .t-math .katex').length;
  luccet.define('probe', (el) => window.__log.push(`define ${el.id} katex=${typeset()}`));
  luccet.on('render', () => window.__log.push(`render katex=${typeset()}`));
  luccet.on('math', (root) => window.__log.push(`math ${root.localName} katex=${typeset()}`));
  luccet.on('ready', () => window.__log.push('ready'));
  luccet.ready.then(() => window.__log.push('ready-promise'));
</script>

# Smoke: lifecycle

KaTeX is loaded in the head, before luccet.js, so it is there before the
behaviours run: they must still run first.
